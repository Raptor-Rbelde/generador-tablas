<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generador de tablas dinámicas manipulando el DOM">
  <title>Generador de Tablas | DOM</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

  <!-- Tipografía Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 desde CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Hoja de estilos propia -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-app">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
          <img src="img/logo.svg" alt="Logotipo del generador de tablas" width="28" height="28">
          Generador de Tablas
        </a>
      </div>
    </nav>
  </header>

  <main class="container my-4">

    <div class="page-header text-center mb-4">
      <h1 class="h3 fw-bold mb-2">Generador de Tablas Dinámicas</h1>
      <p class="lead mb-0">Crea, edita y exporta tablas manipulando el DOM con JavaScript.</p>
    </div>

    <div class="row g-4">

      <!-- Panel de configuración -->
      <section id="panel-configuracion" class="col-12 col-lg-4">
        <h2 class="h5 d-flex align-items-center gap-2">
          <i class="bi bi-sliders" aria-hidden="true"></i> Configuración
        </h2>
        <form id="formConfiguracion" class="card card-body">
          <div class="mb-3">
            <label for="inputFilas" class="form-label">Filas</label>
            <input type="number" id="inputFilas" class="form-control"
                   min="1" max="50" value="3" required>
          </div>
          <div class="mb-3">
            <label for="inputColumnas" class="form-label">Columnas</label>
            <input type="number" id="inputColumnas" class="form-control"
                   min="1" max="20" value="3" required>
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" id="chkEncabezado" class="form-check-input" checked>
            <label for="chkEncabezado" class="form-check-label">Incluir encabezado</label>
          </div>
          <div class="mb-3">
            <label for="selectEstilo" class="form-label">Estilo de tabla</label>
            <select id="selectEstilo" class="form-select">
              <option value="basica">Básica</option>
              <option value="cebra">Cebra</option>
              <option value="bordes">Con bordes</option>
            </select>
          </div>
          <button type="button" id="btnGenerar" class="btn btn-primary">
            <i class="bi bi-table" aria-hidden="true"></i> Generar tabla
          </button>
          <button type="button" id="btnLimpiar" class="btn btn-outline-secondary mt-2">
            <i class="bi bi-eraser" aria-hidden="true"></i> Limpiar
          </button>
        </form>

        <div id="controles-edicion" class="btn-group-vertical w-100 mt-3 d-none" role="group"
             aria-label="Acciones de edición de la tabla">
          <button type="button" id="btnAgregarFila" class="btn btn-outline-primary">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> Agregar fila
          </button>
          <button type="button" id="btnAgregarColumna" class="btn btn-outline-primary">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> Agregar columna
          </button>
          <button type="button" id="btnEliminarFila" class="btn btn-outline-danger">
            <i class="bi bi-dash-lg" aria-hidden="true"></i> Eliminar fila
          </button>
          <button type="button" id="btnEliminarColumna" class="btn btn-outline-danger">
            <i class="bi bi-dash-lg" aria-hidden="true"></i> Eliminar columna
          </button>
          <button type="button" id="btnExportarCSV" class="btn btn-success">
            <i class="bi bi-filetype-csv" aria-hidden="true"></i> Exportar CSV
          </button>
          <button type="button" id="btnCopiarHTML" class="btn btn-success">
            <i class="bi bi-clipboard-check" aria-hidden="true"></i> Copiar HTML
          </button>
        </div>
      </section>

      <!-- Área de trabajo: la tabla se inyecta aquí con JavaScript -->
      <section id="area-tabla" class="col-12 col-lg-8 table-responsive" aria-live="polite">
        <p id="mensajeVacio" class="text-muted">
          <i class="bi bi-table" aria-hidden="true"></i>
          Configure los parámetros y presione “Generar tabla”.
        </p>
      </section>

    </div>

    <!-- Contenedor de avisos (alertas creadas dinámicamente con el DOM) -->
    <div id="avisos" class="position-fixed bottom-0 end-0 p-3" aria-live="assertive"></div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-4">
    <p class="mb-0">Universidad Don Bosco — Lenguajes Interpretados en el Cliente — Ciclo 02-2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
